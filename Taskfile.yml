# yaml-language-server: $schema=https://taskfile.dev/static/schema.json
version: "3"

vars:
  BINDIR: bin
  MODULE: github.com/0siriz/keyweaver
  DEVSUFFIX: +dev
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
  DIRTY:
    sh: test -z "$(git status --porcelain --untracked-files=no)" || echo "-dirty"
  VERSION:
    sh: git describe --dirty --match 'v[0-9]*' 2>/dev/null || echo "{{.COMMIT}}{{.DIRTY}}"
  LDFLAGS: >-
    -X {{.MODULE}}/internal/version.Version={{.VERSION}}{{.DEVSUFFIX}}

tasks:
  default:
    deps: [build]

  build:
    desc: Build all binaries
    cmds:
      - CGO_ENABLED=false go build -buildmode=pie -trimpath -ldflags "{{.LDFLAGS}}" -o "{{.BINDIR}}/kw" ./cmd/kw
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.BINDIR}}/*"

  test:
    desc: Run tests
    cmds:
      - go test ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  clean:
    desc: Clean build artifacts
    cmds:
      - go clean
      - rm -rf "{{.BINDIR}}"

  fmt:
    desc: Format Go source code
    cmds:
      - gofmt -s -w .

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  tidy:
    desc: Tidy Go module dependencies
    cmds:
      - go mod tidy

  check:
    desc: Run all checks (fmt, vet, lint)
    deps: [fmt, vet, lint]
